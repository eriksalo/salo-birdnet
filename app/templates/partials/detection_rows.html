{% for d in detections %}
<tr class="hover:bg-gray-50 dark:hover:bg-surface-700">
    <td class="px-4 py-3 whitespace-nowrap text-gray-500 dark:text-gray-400">{{ d.date }} {{ d.time }}</td>
    <td class="px-4 py-3">
        <a href="/species/{{ d.com_name }}" class="text-emerald-600 dark:text-emerald-400 hover:underline font-medium">{{ d.com_name }}</a>
    </td>
    <td class="px-4 py-3 text-gray-500 dark:text-gray-400 italic">{{ d.sci_name }}</td>
    <td class="px-4 py-3">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium
            {% if d.confidence >= 0.9 %}bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200
            {% elif d.confidence >= 0.7 %}bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200
            {% else %}bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200{% endif %}">
            {{ "%.0f"|format(d.confidence * 100) }}%
        </span>
    </td>
    <td class="px-4 py-3" x-data="{ playing: false }">
        {% if d.file_name %}
        <button @click="
            const a = $refs.a{{ d.id }};
            if (playing) { a.pause(); a.currentTime = 0; } else { a.play(); }
            playing = !playing;
        " class="text-gray-400 hover:text-emerald-500">
            <svg x-show="!playing" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
            </svg>
            <svg x-show="playing" x-cloak class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zm7 0a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z"/>
            </svg>
        </button>
        <audio x-ref="a{{ d.id }}" @ended="playing = false" preload="none">
            <source src="/audio/{{ d.file_name }}" type="audio/mpeg">
        </audio>
        {% endif %}
    </td>
</tr>
{% endfor %}

{% if detections %}
{% set last = detections[-1] %}
<tr hx-get="/detections/rows?last_id={{ last.id }}&species={{ filters.species }}&date_from={{ filters.date_from }}&date_to={{ filters.date_to }}&min_confidence={{ filters.min_confidence }}"
    hx-trigger="revealed" hx-swap="afterend" hx-target="this">
    <td colspan="5" class="px-4 py-3 text-center text-gray-400 htmx-indicator">
        Loading more...
    </td>
</tr>
{% endif %}
