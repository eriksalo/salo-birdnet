<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for s in species_list %}
    <a href="/species/{{ s.com_name }}"
       class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4 hover:border-emerald-500 dark:hover:border-emerald-500 transition-colors block">
        <div class="flex items-start justify-between">
            <div>
                <h3 class="font-semibold text-emerald-600 dark:text-emerald-400">{{ s.com_name }}</h3>
                <p class="text-xs text-gray-500 dark:text-gray-400 italic">{{ s.sci_name }}</p>
            </div>
            <span class="text-lg font-bold text-gray-400">{{ s.detection_count }}</span>
        </div>
        <div class="mt-3 flex items-center gap-4 text-xs text-gray-500 dark:text-gray-400">
            <span>Avg: {{ "%.0f"|format(s.avg_confidence * 100) }}%</span>
            <span>Last: {{ s.last_detected[:10] }}</span>
        </div>
    </a>
    {% endfor %}
</div>

{% if not species_list %}
<p class="text-center text-gray-400 py-8">No species found.</p>
{% endif %}
