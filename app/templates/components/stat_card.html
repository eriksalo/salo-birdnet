<div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
    <div class="flex items-center justify-between">
        <div>
            <p class="text-sm text-gray-500 dark:text-gray-400">{{ label }}</p>
            <p class="text-2xl font-bold mt-1" id="{{ stat_id }}">{{ value }}</p>
        </div>
        <div class="text-3xl">{{ icon }}</div>
    </div>
    {% if subtitle %}
    <p class="text-xs text-gray-400 dark:text-gray-500 mt-2">{{ subtitle }}</p>
    {% endif %}
</div>
