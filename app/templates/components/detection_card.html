<div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4 hover:border-emerald-500 dark:hover:border-emerald-500 transition-colors">
    <div class="flex items-start justify-between gap-3">
        <div class="flex-1 min-w-0">
            <a href="/species/{{ detection.com_name }}" class="text-base font-semibold text-emerald-600 dark:text-emerald-400 hover:underline truncate block">
                {{ detection.com_name }}
            </a>
            <p class="text-xs text-gray-500 dark:text-gray-400 italic">{{ detection.sci_name }}</p>
            <div class="flex items-center gap-3 mt-2 text-xs text-gray-500 dark:text-gray-400">
                <span>{{ detection.date }} {{ detection.time }}</span>
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium
                    {% if detection.confidence >= 0.9 %}bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200
                    {% elif detection.confidence >= 0.7 %}bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200
                    {% else %}bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200{% endif %}">
                    {{ "%.0f"|format(detection.confidence * 100) }}%
                </span>
            </div>
        </div>
        {% if detection.file_name %}
        <div x-data="{ playing: false }" class="flex-shrink-0">
            <button @click="
                const audio = $refs.audio;
                if (playing) { audio.pause(); audio.currentTime = 0; }
                else { audio.play(); }
                playing = !playing;
            " class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-surface-700 text-gray-500 dark:text-gray-400">
                <svg x-show="!playing" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                </svg>
                <svg x-show="playing" x-cloak class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zm7 0a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z"/>
                </svg>
            </button>
            <audio x-ref="audio" @ended="playing = false" preload="none">
                <source src="/audio/{{ detection.file_name }}" type="audio/mpeg">
            </audio>
        </div>
        {% endif %}
    </div>
</div>
