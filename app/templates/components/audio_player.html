{# Full audio player component with waveform progress #}
<div x-data="{
    playing: false,
    currentTime: 0,
    duration: 0,
    progress: 0,
    init() {
        const audio = this.$refs.audio;
        audio.addEventListener('timeupdate', () => {
            this.currentTime = audio.currentTime;
            this.progress = (audio.currentTime / audio.duration) * 100 || 0;
        });
        audio.addEventListener('loadedmetadata', () => { this.duration = audio.duration; });
        audio.addEventListener('ended', () => { this.playing = false; this.progress = 0; });
    },
    toggle() {
        const audio = this.$refs.audio;
        if (this.playing) { audio.pause(); } else { audio.play(); }
        this.playing = !this.playing;
    },
    seek(e) {
        const audio = this.$refs.audio;
        const rect = e.target.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
    },
    fmt(s) { return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }
}" class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
    <audio x-ref="audio" preload="metadata">
        <source src="{{ audio_url }}" type="audio/mpeg">
    </audio>
    <div class="flex items-center gap-3">
        <button @click="toggle()" class="p-2 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex-shrink-0">
            <svg x-show="!playing" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
            </svg>
            <svg x-show="playing" x-cloak class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M5.75 3a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75A.75.75 0 007.25 3h-1.5zm7 0a.75.75 0 00-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 00.75-.75V3.75a.75.75 0 00-.75-.75h-1.5z"/>
            </svg>
        </button>
        <span class="text-xs text-gray-500 w-10" x-text="fmt(currentTime)">0:00</span>
        <div class="flex-1 h-2 bg-gray-200 dark:bg-gray-700 rounded-full cursor-pointer" @click="seek($event)">
            <div class="h-full bg-emerald-500 rounded-full transition-all" :style="'width:' + progress + '%'"></div>
        </div>
        <span class="text-xs text-gray-500 w-10" x-text="fmt(duration)">0:00</span>
    </div>
    {% if spectrogram_url %}
    <img src="{{ spectrogram_url }}" alt="Spectrogram" class="mt-3 w-full rounded border dark:border-gray-700" loading="lazy">
    {% endif %}
</div>
