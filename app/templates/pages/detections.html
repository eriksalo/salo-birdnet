{% extends "base.html" %}
{% block title %}Detection History - Salo BirdNET{% endblock %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-xl font-bold">Detection History</h1>

    <!-- Filters -->
    <div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
        <form hx-get="/detections/rows" hx-target="#detection-table-body" hx-swap="innerHTML"
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Species</label>
                <select name="species" class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-surface-700 text-sm p-2">
                    <option value="">All species</option>
                    {% for s in all_species %}
                    <option value="{{ s }}" {{ 'selected' if filters.species == s }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">From</label>
                <input type="date" name="date_from" value="{{ filters.date_from }}"
                       class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-surface-700 text-sm p-2">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">To</label>
                <input type="date" name="date_to" value="{{ filters.date_to }}"
                       class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-surface-700 text-sm p-2">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Min Confidence: <span x-data="{v: {{ filters.min_confidence }}}" x-text="Math.round(v*100)+'%'"></span></label>
                <input type="range" name="min_confidence" min="0" max="1" step="0.05" value="{{ filters.min_confidence }}"
                       class="w-full" x-data x-on:input="$el.previousElementSibling.querySelector('span').__x.$data.v = $el.value">
            </div>
            <div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-md px-4 py-2 text-sm font-medium">
                    Filter
                </button>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 dark:bg-surface-700">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date/Time</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Species</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Scientific Name</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Confidence</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Audio</th>
                    </tr>
                </thead>
                <tbody id="detection-table-body" class="divide-y divide-gray-200 dark:divide-gray-700">
                    {% include "partials/detection_rows.html" %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
