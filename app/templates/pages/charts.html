{% extends "base.html" %}
{% block title %}Charts - Salo BirdNET{% endblock %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-xl font-bold">Charts & Statistics</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Daily activity -->
        <div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold">Daily Detections</h3>
                <select id="daily-days" class="text-xs rounded border-gray-300 dark:border-gray-600 dark:bg-surface-700 px-2 py-1">
                    <option value="7">7 days</option>
                    <option value="30" selected>30 days</option>
                    <option value="90">90 days</option>
                    <option value="365">1 year</option>
                </select>
            </div>
            <canvas id="daily-chart" height="250"></canvas>
        </div>

        <!-- Hourly activity -->
        <div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
            <h3 class="text-sm font-semibold mb-3">Today's Hourly Activity</h3>
            <canvas id="hourly-chart" height="250"></canvas>
        </div>

        <!-- Weekly trends -->
        <div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
            <h3 class="text-sm font-semibold mb-3">Weekly Trends</h3>
            <canvas id="weekly-chart" height="250"></canvas>
        </div>

        <!-- Species heatmap placeholder -->
        <div class="bg-white dark:bg-surface-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
            <h3 class="text-sm font-semibold mb-3">Top Species by Hour</h3>
            <div id="heatmap-container" class="overflow-x-auto">
                <canvas id="heatmap-chart" height="300"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let dailyChart, hourlyChart, weeklyChart;

async function loadDailyChart(days = 30) {
    const res = await fetch(`/charts/data/daily?days=${days}`);
    const data = await res.json();
    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart(document.getElementById('daily-chart'), {
        type: 'bar',
        data: {
            labels: data.labels,
            datasets: [{
                label: 'Detections',
                data: data.data,
                backgroundColor: 'rgba(16, 185, 129, 0.6)',
                borderColor: 'rgb(16, 185, 129)',
                borderWidth: 1, borderRadius: 2,
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { maxTicksLimit: 10, color: '#9ca3af', font: { size: 10 } }, grid: { display: false } },
                y: { beginAtZero: true, ticks: { color: '#9ca3af' }, grid: { color: 'rgba(156,163,175,0.1)' } }
            }
        }
    });
}

async function loadHourlyChart() {
    const res = await fetch('/charts/data/hourly');
    const data = await res.json();
    if (hourlyChart) hourlyChart.destroy();
    hourlyChart = new Chart(document.getElementById('hourly-chart'), {
        type: 'bar',
        data: {
            labels: data.labels,
            datasets: [{
                label: 'Detections',
                data: data.data,
                backgroundColor: 'rgba(59, 130, 246, 0.6)',
                borderColor: 'rgb(59, 130, 246)',
                borderWidth: 1, borderRadius: 2,
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { maxTicksLimit: 8, color: '#9ca3af', font: { size: 10 } }, grid: { display: false } },
                y: { beginAtZero: true, ticks: { color: '#9ca3af' }, grid: { color: 'rgba(156,163,175,0.1)' } }
            }
        }
    });
}

async function loadWeeklyChart() {
    const res = await fetch('/charts/data/weekly');
    const data = await res.json();
    if (weeklyChart) weeklyChart.destroy();
    weeklyChart = new Chart(document.getElementById('weekly-chart'), {
        type: 'line',
        data: {
            labels: data.labels,
            datasets: [
                {
                    label: 'Detections',
                    data: data.detection_counts,
                    borderColor: 'rgb(16, 185, 129)',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    fill: true, tension: 0.3,
                    yAxisID: 'y',
                },
                {
                    label: 'Species',
                    data: data.species_counts,
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true, tension: 0.3,
                    yAxisID: 'y1',
                }
            ]
        },
        options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } } },
            scales: {
                x: { ticks: { color: '#9ca3af', font: { size: 10 } }, grid: { display: false } },
                y: { type: 'linear', position: 'left', beginAtZero: true, ticks: { color: '#10b981' }, grid: { color: 'rgba(156,163,175,0.1)' } },
                y1: { type: 'linear', position: 'right', beginAtZero: true, ticks: { color: '#3b82f6' }, grid: { drawOnChartArea: false } },
            }
        }
    });
}

async function loadHeatmap() {
    const res = await fetch('/charts/data/heatmap');
    const rawData = await res.json();
    if (!rawData.length) return;

    const species = [...new Set(rawData.map(d => d.com_name))];
    const hours = Array.from({length: 24}, (_, i) => i);

    // Build matrix
    const datasets = species.map((sp, idx) => {
        const counts = {};
        rawData.filter(d => d.com_name === sp).forEach(d => { counts[d.hour] = d.count; });
        return {
            label: sp,
            data: hours.map(h => ({ x: `${String(h).padStart(2,'0')}:00`, y: sp, v: counts[h] || 0 })),
        };
    });

    // Simple bubble chart as heatmap approximation
    const flatData = [];
    rawData.forEach(d => {
        flatData.push({ x: `${String(d.hour).padStart(2,'0')}:00`, y: d.com_name, r: Math.sqrt(d.count) * 2, v: d.count });
    });

    new Chart(document.getElementById('heatmap-chart'), {
        type: 'bubble',
        data: {
            datasets: [{
                data: flatData.map(d => ({ x: hours.indexOf(parseInt(d.x)), y: species.indexOf(d.y), r: Math.min(d.r, 15) })),
                backgroundColor: 'rgba(16, 185, 129, 0.5)',
                borderColor: 'rgb(16, 185, 129)',
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false }, tooltip: {
                callbacks: {
                    label: (ctx) => {
                        const d = flatData[ctx.dataIndex];
                        return d ? `${d.y}: ${d.v} at ${d.x}` : '';
                    }
                }
            }},
            scales: {
                x: { min: -0.5, max: 23.5, ticks: { callback: v => `${String(v).padStart(2,'0')}:00`, maxTicksLimit: 12, color: '#9ca3af', font: {size: 10} }, grid: { color: 'rgba(156,163,175,0.1)' } },
                y: { min: -0.5, max: species.length - 0.5, ticks: { callback: v => species[v] || '', color: '#9ca3af', font: {size: 10} }, grid: { color: 'rgba(156,163,175,0.1)' } },
            }
        }
    });
}

document.getElementById('daily-days').addEventListener('change', (e) => loadDailyChart(e.target.value));

// Load all charts
loadDailyChart();
loadHourlyChart();
loadWeeklyChart();
loadHeatmap();
</script>
{% endblock %}
